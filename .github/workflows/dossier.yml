name: Weekly dossier

on:
  schedule:
    # Tuesday 17:00 UTC (6pm BST / 5pm GMT) — well clear of Monday Night
    # Football, and late enough to leave the morning free for fixes before
    # anything goes out. GitHub cron is always UTC and does not follow DST.
    - cron: "0 17 * * 2"
  workflow_dispatch:
    inputs:
      worksheet:
        description: "Sheet tab to read (leave blank for the scheduled default: production)"
        required: false
        default: "Test"
      show_appendix:
        description: "Force the new-analytics appendix on, even before it has enough data to mean anything"
        required: false
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for --pdf)
        run: playwright install --with-deps chromium

      - name: Write service account key
        run: echo "$GOOGLE_SHEETS_CREDENTIALS_JSON" > /tmp/gsheets-key.json
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}

      - name: Generate and email dossiers
        env:
          GOOGLE_SHEETS_CREDENTIALS: /tmp/gsheets-key.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Renders the appendix regardless of how many weeks have been played.
          # Defaults on for a manual run (that's the point of dispatching one)
          # and stays off for the schedule, so the weekly mail to subscribers
          # keeps its own gating — at week 1 those tables read 0.5 expected
          # wins for every team and a blank chart.
          SLEEPER_SHOW_APPENDIX: ${{ (github.event_name == 'workflow_dispatch' && inputs.show_appendix) && '1' || '' }}
        run: |
          python -m sleeper_dossier.batch \
            --sheet "${{ secrets.SHEET_ID }}" \
            --worksheet "${{ github.event.inputs.worksheet || 'production' }}" \
            --week latest \
            --email \
            --pdf \
            --outdir reports
